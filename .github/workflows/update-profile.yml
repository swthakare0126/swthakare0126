name: Update GitHub Profile Snapshot

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Contribution Snake"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-readme:
    name: Sync Profile Stats, Repos & Activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_profile.py

      - name: Commit and push changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): auto-update GitHub metrics & activity"
          git push
